{% extends "base.html" %}
{% block content %}
<h2>Nuevo Anuncio</h2>
<form method="POST">
    <div class="mb-3"><label>Título</label><input type="text" name="titulo" class="form-control" required></div>
    <div class="mb-3">
        <label>Categoría</label>
        <select name="categoria_id" class="form-select" required>
            {% for c in categorias %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}
        </select>
    </div>
    <div class="mb-3"><label>Contenido</label><textarea name="contenido" class="form-control" rows="4" required></textarea></div>
    <button type="submit" class="btn btn-success">Publicar</button>
</form>
{% endblock %}
