{% extends "base.html" %}
{% block content %}
<h2>Categorías</h2>
<a href="{{ url_for('categorias.form') }}" class="btn btn-primary mb-3">Nueva Categoría</a>
<ul class="list-group">
    {% for c in categorias %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ c.nombre }}
        <div>
            <a href="{{ url_for('categorias.form', id=c.id) }}" class="btn btn-sm btn-warning">Editar</a>
            <a href="{{ url_for('categorias.eliminar', id=c.id) }}" class="btn btn-sm btn-danger">Eliminar</a>
        </div>
    </li>
    {% endfor %}
</ul>
{% endblock %}
