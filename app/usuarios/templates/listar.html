{% extends "base.html" %}
{% block content %}
<h2>Usuarios</h2>
<a href="{{ url_for('usuarios.crear') }}" class="btn btn-primary mb-3">Nuevo Usuario</a>
<table class="table table-striped">
    <thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Acciones</th></tr></thead>
    <tbody>
        {% for u in usuarios %}
        <tr>
            <td>{{ u.id }}</td><td>{{ u.nombre }}</td><td>{{ u.email }}</td>
            <td>
                <a href="{{ url_for('usuarios.editar', id=u.id) }}" class="btn btn-sm btn-warning">Editar</a>
                <a href="{{ url_for('usuarios.eliminar', id=u.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro?')">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
